# Release-level deliverables: what has to be produced, from which per-subject progress,
# by whom, with which script, and where the output goes.
#
# Load or reload:   cd server && npm run plan:load   (keeps live status and assignees; --prune deletes removed entries)
#
#   depends_on   deliverables that must be done first
#   gates        share of a pipeline's units that must be past a step first, e.g.
#                { pipeline: abcd-dmri, step: atlas_reg, done: 0.95 }   (step omitted = whole pipeline complete)
#   items        work that produces the deliverable, in order (`after` = earlier items it needs)
#                mode manual     a person does it (assignee)
#                mode automated  a script does it (workflow); assignee = who runs it
#                output          where the result goes; uses the study's path inventory plus {release} {deliverable}
#   workflows    the scripts; trigger external = run by a person or existing scheduler and reported here
#                (on_ready / manual = launched by the tracker through a worker, for later)

workflows:
  - { id: roi-tabulate, name: Tabulate ROI measures, engine: matlab, trigger: external, maintainer: Tomas H.,
      command: "abcdConcatROI('{study}', '{release}', '{tables_root}')" }
  - { id: nq-tabulate, name: Export NeuroQuant volumes, engine: python, trigger: external, maintainer: Tomas H.,
      command: "python nq_to_csv.py {nq_root} {tables_root}/neuroquant_volumes.csv" }
  - { id: concat-voxelwise, name: Concatenate voxelwise data, engine: matlab, trigger: external, maintainer: You,
      command: "concat_voxelwise('{atlas_root}', '{concat_root}/voxelwise')" }
  - { id: concat-vertexwise, name: Concatenate vertexwise data, engine: matlab, trigger: external, maintainer: You,
      command: "concat_vertexwise('{atlas_root}', '{concat_root}/vertexwise')" }
  - { id: svd, name: SVD of concatenated data, engine: matlab, trigger: external, maintainer: You,
      command: "concat_svd('{concat_root}', '{svd_root}')" }
  - { id: fema-maps, name: FEMA precomputed maps, engine: matlab, trigger: external, maintainer: You,
      command: "FEMA_write_job / FEMA_fit (release {release})" }
  - { id: qc-summary, name: QC summary report, engine: python, trigger: external, maintainer: Priya N.,
      command: "python qc_summary.py --study {study} --release {release}" }
  - { id: normative-fit, name: Normative model fit, engine: matlab, trigger: external, maintainer: You,
      command: "fit_normative_models('{deliverable}')" }

