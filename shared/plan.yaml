# Deliverables, their dependencies and owners, the work items that produce them,
# and the automatable workflows those items run.
#
# Load or reload into the database with:   cd server && npm run plan:load
# Reloading updates definitions (titles, dependencies, owners, workflows) but keeps the
# live status and assignee of items that already exist. Add --prune to delete
# deliverables, items and workflows that are no longer in this file.
#
# Dependencies
#   depends_on:  other deliverables that must be done first
#   gates:       pipelines that must reach a released share first (0-1)
#   after:       items in the same deliverable that must be done first
# Workflows
#   trigger: on_ready  starts automatically once its item is unblocked
#   trigger: manual    waits for someone to press Run (for steps that need a go/no-go)
#   command placeholders: {study} {deliverable} {item} {run_id}

workflows:
  - { id: qc-report, name: Imaging QC summary report, engine: python, trigger: on_ready, maintainer: Priya N.,
      command: "python qc_report.py --study {study} --out reports/{deliverable}" }
  - { id: roi-extract, name: FreeSurfer ROI extraction, engine: nextflow, trigger: on_ready, maintainer: Tomas H.,
      command: "nextflow run roi-extract.nf --study {study} -name {deliverable}-{run_id}" }
  - { id: dti-tractstats, name: DTI tract statistics, engine: nextflow, trigger: on_ready, maintainer: Tomas H.,
      command: "nextflow run tractstats.nf --study {study} -name {deliverable}-{run_id}" }
  - { id: combat-harmonize, name: ComBat scanner harmonization, engine: python, trigger: on_ready, maintainer: Tomas H.,
      command: "python combat_harmonize.py --deliverable {deliverable}" }
  - { id: topmed-impute, name: TOPMed imputation, engine: slurm, trigger: on_ready, maintainer: Marcus O.,
      command: "sbatch --wait impute_topmed.sh {study}" }
  - { id: ancestry-pcs, name: Ancestry principal components, engine: slurm, trigger: on_ready, maintainer: Marcus O.,
      command: "sbatch --wait ancestry_pcs.sh {study}" }
  - { id: package-release, name: Package data release, engine: script, trigger: on_ready, maintainer: Ingrid L.,
      command: "./package_release.sh {study} {deliverable}" }
  - { id: deap-upload, name: Upload release to DEAP, engine: script, trigger: manual, maintainer: Ingrid L.,
      command: "./deap_upload.sh {deliverable}",
      description: "Manual trigger: publishing needs a go decision." }
  - { id: deap-smoke-test, name: DEAP smoke test, engine: script, trigger: on_ready, maintainer: Ingrid L.,
      command: "./deap_smoke_test.sh {deliverable}" }
  - { id: dictionary-publish, name: Publish data dictionary, engine: script, trigger: on_ready, maintainer: Sara K.,
      command: "./publish_dictionary.sh {study}" }
  - { id: fema-write-jobs, name: FEMA write jobs, engine: python, trigger: on_ready, maintainer: You,
      command: "python FEMA_write_job.py --release {deliverable}" }
  - { id: fema-fit, name: FEMA_fit vertexwise/voxelwise, engine: slurm, trigger: on_ready, maintainer: You,
      command: "sbatch --wait --array=1-200 fema_fit.sh {deliverable}" }
  - { id: infant-seg, name: Infant segmentation, engine: nextflow, trigger: on_ready, maintainer: Tomas H.,
      command: "nextflow run infant-seg.nf --study {study}" }
  - { id: eeg-features, name: EEG feature extraction, engine: python, trigger: on_ready, maintainer: Priya N.,
      command: "python eeg_features.py --study {study}" }
  - { id: pheno-extract, name: Imaging phenotype extraction, engine: python, trigger: on_ready, maintainer: Marcus O.,
      command: "python extract_idps.py --study {study} --modality dmri" }
  - { id: regenie-gwas, name: REGENIE GWAS, engine: slurm, trigger: on_ready, maintainer: Marcus O.,
      command: "sbatch --wait regenie_gwas.sh {deliverable}" }
  - { id: centiloid, name: Centiloid calculation, engine: python, trigger: on_ready, maintainer: Tomas H.,
      command: "python centiloid.py --study {study}" }
  - { id: tracer-harmonize, name: Cross-tracer harmonization, engine: python, trigger: on_ready, maintainer: Tomas H.,
      command: "python tracer_harmonize.py --study {study}" }
  - { id: normative-fit, name: Normative model fit, engine: slurm, trigger: on_ready, maintainer: You,
      command: "sbatch --wait normative_fit.sh {deliverable}" }
  - { id: normative-validate, name: Normative model validation, engine: python, trigger: on_ready, maintainer: You,
      command: "python normative_validate.py --deliverable {deliverable}" }
  - { id: deviation-scores, name: Deviation scores, engine: python, trigger: on_ready, maintainer: Tomas H.,
      command: "python deviation_scores.py --study {study}" }
  - { id: case-control-stats, name: Case-control statistics, engine: python, trigger: on_ready, maintainer: Tomas H.,
      command: "python case_control.py --study {study}" }

deliverables:
