# Study configuration: people, path inventory, visits, and the processing chain per modality.
#
# Settings resolve in this order (later wins):  defaults → study → study.modalities.<modality>
#
# PATH INVENTORY
#   `paths` define named locations (raw_root, mmps_root, ...). They seed the editable path
#   inventory on the dashboard (Paths tab); after the first load the dashboard is the place to
#   edit them, and `npm run config:load` leaves edited entries alone (use --paths to overwrite).
#   Values may use {study} {release} and other path names. Step `output` templates use the names
#   plus {subject} {visit} {modality}; the import and scan scripts check those paths on disk.
#   All paths below are placeholders except where noted: set them to your real layout.
#
# TRACKING MODE
#   launch: external — the tracker launches nothing; people and existing scripts run the jobs,
#   and `npm run scan` (or the API) records progress. Steps can be switched to `scheduler` later.
#
# Apply edits to a running system:   cd server && npm run config:load
# Changing which steps a pipeline has (add_steps / skip) needs a reseed: npm run db:reset

people:
  - { name: You, role: study_lead }
  - { name: Priya N., role: qc_reviewer }
  - { name: Tomas H., role: qc_reviewer }
  - { name: Ingrid L., role: data_manager }
  - { name: Marcus O., role: genomics_analyst }
  - { name: Wei C., role: lab_liaison }
  - { name: Sara K., role: data_manager }

defaults:
  launch: external
  scheduler: { batch_size: auto, max_active_runs_per_step: 2, auto_retry: 0, qc_batch_size: 50 }
  host: local
  paths:
    raw_root: ~/data/{study}/raw                  # raw DICOM / source files per subject and visit
    mmps_root: ~/data/{study}/mmps/proc           # MMPS processing containers
    fsurf_root: ~/data/{study}/mmps/fsurf         # FreeSurfer recon (via MMPS)
    nq_root: ~/data/{study}/neuroquant            # NeuroQuant reports and volumes
    roi_root: ~/data/{study}/derivatives/roi      # per-subject ROI measures
    atlas_root: ~/data/{study}/derivatives/atlas  # results registered to atlas space
    concat_root: ~/data/{study}/concat/{release}  # concatenated voxelwise / vertexwise data
    svd_root: "{concat_root}/svd"                 # SVD of concatenated data
    tables_root: ~/data/{study}/tables/{release}  # release spreadsheets
  pipelines:
    smri:
      steps:
        - { key: import, name: Raw data on disk, mode: auto, output: "{raw_root}/{subject}/{visit}" }
        - { key: mmps_proc, name: MMPS processing, mode: auto, output: "{mmps_root}/MRIPROC_{subject}_{visit}" }
        - { key: fsurf, name: FreeSurfer recon, mode: auto, output: "{fsurf_root}/FSURF_{subject}_{visit}" }
        - { key: neuroquant, name: NeuroQuant, mode: auto, output: "{nq_root}/{subject}_{visit}" }
        - { key: qc, name: Image QC, mode: manual, role: qc_reviewer, sla_days: 7, task_label: sMRI QC, exclude_reason: QC_FAIL }
        - { key: roi_extract, name: ROI measures extracted, mode: auto, output: "{roi_root}/smri/{subject}_{visit}.csv" }
        - { key: atlas_reg, name: Registered to atlas (vertexwise), mode: auto, output: "{atlas_root}/smri/{subject}/{visit}" }
    dmri:
      steps:
        - { key: import, name: Raw data on disk, mode: auto, output: "{raw_root}/{subject}/{visit}" }
        - { key: mmps_proc, name: MMPS processing (DTI/RSI), mode: auto, output: "{mmps_root}/DTIPROC_{subject}_{visit}" }
        - { key: qc, name: Image QC, mode: manual, role: qc_reviewer, sla_days: 7, task_label: dMRI QC, exclude_reason: QC_FAIL }
        - { key: roi_extract, name: ROI and tract measures extracted, mode: auto, output: "{roi_root}/dmri/{subject}_{visit}.csv" }
        - { key: atlas_reg, name: Registered to atlas (voxelwise), mode: auto, output: "{atlas_root}/dmri/{subject}/{visit}" }
    fmri:
      steps:
        - { key: import, name: Raw data on disk, mode: auto, output: "{raw_root}/{subject}/{visit}" }
        - { key: mmps_proc, name: MMPS processing (rs/task fMRI), mode: auto, output: "{mmps_root}/BOLDPROC_{subject}_{visit}" }
        - { key: qc, name: Image QC, mode: manual, role: qc_reviewer, sla_days: 7, task_label: fMRI QC, exclude_reason: QC_FAIL }
        - { key: roi_extract, name: ROI and connectivity measures extracted, mode: auto, output: "{roi_root}/fmri/{subject}_{visit}.csv" }
        - { key: atlas_reg, name: Registered to atlas (vertexwise), mode: auto, output: "{atlas_root}/fmri/{subject}/{visit}" }
    pet:
      steps:
        - { key: import, name: Raw data on disk, mode: auto, output: "{raw_root}/{subject}/{visit}/pet" }
        - { key: mmps_proc, name: MMPS PET processing, mode: auto, output: "{mmps_root}/PETPROC_{subject}_{visit}" }
        - { key: qc, name: Image QC, mode: manual, role: qc_reviewer, sla_days: 7, task_label: PET QC, exclude_reason: QC_FAIL }
        - { key: roi_extract, name: SUVR measures extracted, mode: auto, output: "{roi_root}/pet/{subject}_{visit}.csv" }
        - { key: atlas_reg, name: Registered to atlas, mode: auto, output: "{atlas_root}/pet/{subject}/{visit}" }
    eeg:
      steps:
        - { key: import, name: Raw data on disk, mode: auto, output: "{raw_root}/{subject}/{visit}/eeg" }
        - { key: preprocess, name: EEG preprocessing, mode: auto, output: "~/data/{study}/eeg/proc/{subject}_{visit}" }
        - { key: qc, name: EEG QC, mode: manual, role: qc_reviewer, sla_days: 7, task_label: EEG QC, exclude_reason: QC_FAIL }
        - { key: roi_extract, name: EEG features extracted, mode: auto, output: "{roi_root}/eeg/{subject}_{visit}.csv" }
    genomics:
      steps:
        - { key: import, name: Genotypes on disk, mode: auto, output: "~/data/{study}/genomics/raw" }
        - { key: qc, name: Sample QC review, mode: manual, role: genomics_analyst, sla_days: 5, task_label: Genotype QC, exclude_reason: GENO_QC_FAIL }
        - { key: impute, name: Imputed, mode: auto, output: "~/data/{study}/genomics/imputed" }
        - { key: pcs, name: Ancestry PCs, mode: auto, output: "~/data/{study}/genomics/pcs.tsv" }
    biospecimen:
      steps:
        - { key: import, name: Assay results on disk, mode: auto, output: "~/data/{study}/biospecimens/{visit}" }
        - { key: qc, name: Assay batch review, mode: manual, role: lab_liaison, sla_days: 5, task_label: Assay batch review, exclude_reason: ASSAY_FAIL }
        - { key: tabulate, name: Tabulated, mode: auto, output: "{tables_root}/biospecimens.csv" }
    assessment:
      steps:
        - { key: import, name: Assessment data on disk, mode: auto, output: "~/data/{study}/assessments/{visit}" }
        - { key: qc, name: Site queries resolved, mode: manual, role: data_manager, sla_days: 10, task_label: Resolve site queries, exclude_reason: DATA_UNRESOLVABLE }
        - { key: tabulate, name: Harmonized and tabulated, mode: auto, output: "{tables_root}/assessments.csv" }

studies:
  - id: ABCD
    name: Adolescent Brain Cognitive Dev.
    source: NDA (on disk)
    release: "6.0"
    visits: [baseline_year_1_arm_1, 2_year_follow_up_y_arm_1, 4_year_follow_up_y_arm_1, 6_year_follow_up_y_arm_1]
    paths:
      # From your machine: ABCD 6.0 concatenated data
      concat_root: ~/2025-11-19_ABCD_concat_uncompressed/6_0/concatenated/imaging
    team: { qc_reviewer: [Priya N., Tomas H.], data_manager: [Ingrid L., Sara K.], genomics_analyst: [Marcus O.] }
    modalities:
      smri: { units: 40100 }
      dmri: { units: 38200 }
      fmri: { units: 37600 }
      genomics: { units: 11800 }
      assessment: { units: 47300 }
    sim: { activity: 5, released: 0.76, not_received: 0.15 }

  - id: HBCD
    name: HEALthy Brain & Child Dev.
    source: NDA (on disk)
    release: "2.0"
    visits: [V02, V03, V04]
